name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install isolated action build dependencies
        run: npm --prefix actions/aic-rely ci --ignore-scripts --no-audit --no-fund

      - name: Verify bundled action matches reviewed source
        run: pnpm verify:action-bundle

      - name: Typecheck workspace
        run: pnpm check

      - name: Build workspace
        run: pnpm build

      - name: Smoke adoption flow
        run: pnpm smoke:adoption

      - name: Smoke init flow
        run: pnpm smoke:init

      - name: Smoke MCP flow
        run: pnpm smoke:mcp

      - name: Verify golden artifacts
        run: pnpm test:goldens -- --actual-dir .artifacts/golden-review

      - name: Run contract tests
        run: pnpm test:contracts

      - name: Upload golden review artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golden-review
          path: .artifacts/golden-review
